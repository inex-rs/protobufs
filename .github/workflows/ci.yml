name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: cargo install protoc-gen-buffa-packaging --locked
      - run: buf lint
      - run: buf generate
      - run: cargo check --locked --all-features
        working-directory: packages/rust
      - run: cargo check --locked --no-default-features
        working-directory: packages/rust
      - run: deno check mod.ts
        working-directory: packages/ts

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Advisories, licences, bans and sources, per packages/rust/deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: packages/rust/Cargo.toml

  publish:
    if: github.event_name == 'push'
    needs: [check, deny]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          token: ${{ secrets.BUF_TOKEN }}
          push_create_visibility: public
      - uses: dtolnay/rust-toolchain@stable
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: cargo install protoc-gen-buffa-packaging --locked
      - run: buf generate
      - run: cp LICENSE packages/rust/LICENSE && cp LICENSE packages/ts/LICENSE && cp README.md packages/rust/README.md && cp README.md packages/ts/README.md
      # Every push to master reaches this job, so a version already on the
      # registries is skipped rather than failing the run.
      - id: published
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' packages/rust/Cargo.toml | head -1)
          crate=$(curl -s -o /dev/null -w '%{http_code}' -A 'inex-rs/protobufs ci' "https://crates.io/api/v1/crates/inex-protobufs/$v")
          jsr=$(curl -s -o /dev/null -w '%{http_code}' "https://jsr.io/@inex/protobufs/${v}_meta.json")
          echo "crate=$([ "$crate" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "jsr=$([ "$jsr" = 200 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.published.outputs.crate == 'false'
        id: crates-auth
      - run: cargo publish --allow-dirty
        if: steps.published.outputs.crate == 'false'
        working-directory: packages/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
      - run: deno publish --allow-dirty
        if: steps.published.outputs.jsr == 'false'
        working-directory: packages/ts
