edition = "2023";

package inex.saros.v1;

import "google/protobuf/timestamp.proto";
import "inex/saros/v1/saros.proto";

// Passwordless sign-in via WebAuthn/passkeys — no external IdP. BeginPasskey
// returns the browser's ceremony options as JSON (flow_id ties a finish to its
// begin); FinishPasskey verifies the credential and mints the bearer token.
service AuthService {
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);

  // Empty username signs in (usernameless); a username registers a new account.
  rpc BeginPasskey(BeginPasskeyRequest) returns (BeginPasskeyResponse);
  rpc FinishPasskey(FinishPasskeyRequest) returns (FinishPasskeyResponse);

  // Sign a tool (CLI, studio) in without pasting a token: it opens
  // verification_uri; WatchLogin streams the decision.
  rpc BeginLogin(BeginLoginRequest) returns (BeginLoginResponse);
  // Stream the sign-in's status until it's decided (approved/denied/expired) —
  // replaces client polling.
  rpc WatchLogin(WatchLoginRequest) returns (stream WatchLoginResponse);
  // Browser side of that flow (session required).
  rpc DescribeLogin(DescribeLoginRequest) returns (DescribeLoginResponse);
  rpc DecideLogin(DecideLoginRequest) returns (DecideLoginResponse);

  // A long-lived token for headless/CI use (session required).
  rpc CreateApiToken(CreateApiTokenRequest) returns (CreateApiTokenResponse);

  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // ── account self-service (session required) ──
  // Adding a credential runs a second registration ceremony against the
  // existing account.
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  rpc BeginAddCredential(BeginAddCredentialRequest) returns (BeginAddCredentialResponse);
  rpc FinishAddCredential(FinishAddCredentialRequest) returns (FinishAddCredentialResponse);
  // Refused if it's the account's last credential.
  rpc RemoveCredential(RemoveCredentialRequest) returns (RemoveCredentialResponse);

  // Stream the caller's live sign-ins (browser sessions + API/CLI tokens),
  // re-emitted on any add/revoke.
  rpc WatchSessions(WatchSessionsRequest) returns (stream WatchSessionsResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  // Revoke every session except the one making the request ("sign out
  // everywhere"). Returns how many were revoked.
  rpc RevokeOtherSessions(RevokeOtherSessionsRequest) returns (RevokeOtherSessionsResponse);

  // Set (or, with an empty address, clear) the caller's recovery email. Unique
  // across accounts.
  rpc SetEmail(SetEmailRequest) returns (SetEmailResponse);

  // The caller's own security activity (sign-ins, credential/session/token/
  // email changes) as a live newest-first stream — the account "security log".
  rpc WatchOwnActivity(WatchOwnActivityRequest) returns (stream WatchOwnActivityResponse);

  // In-app notification inbox (submission decisions, new sign-ins, new firmware
  // on followed devices) — a live stream for the bell, plus mark-read.
  rpc WatchNotifications(WatchNotificationsRequest) returns (stream WatchNotificationsResponse);
  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (MarkNotificationReadResponse);
  rpc MarkAllNotificationsRead(MarkAllNotificationsReadRequest) returns (MarkAllNotificationsReadResponse);
}

enum PasskeyMode {
  PASSKEY_MODE_UNSPECIFIED = 0;
  PASSKEY_MODE_REGISTER = 1;
  PASSKEY_MODE_AUTHENTICATE = 2;
}

message BeginPasskeyRequest {
  string username = 1;
}

message BeginPasskeyResponse {
  string flow_id = 1;
  string options_json = 2;
  PasskeyMode mode = 3;
}

message FinishPasskeyRequest {
  string flow_id = 1;
  string credential_json = 2;
  // Registration only (ignored when signing in): an optional recovery email.
  string email = 3;
}

message FinishPasskeyResponse {
  string session_token = 1;
  string username = 2;
}

enum LoginStatus {
  LOGIN_STATUS_UNSPECIFIED = 0;
  LOGIN_STATUS_PENDING = 1;
  LOGIN_STATUS_APPROVED = 2;
  LOGIN_STATUS_DENIED = 3;
  LOGIN_STATUS_EXPIRED = 4;
}

message BeginLoginRequest {
  // Shown to the approver, e.g. "saros CLI on hostname".
  string label = 1;
}

message BeginLoginResponse {
  // The secret the tool polls with.
  string device_code = 1;
  // Short human code, also prefilled into verification_uri.
  string user_code = 2;
  string verification_uri = 3;
  int32 interval_secs = 4;
  int32 expires_in_secs = 5;
}

message WatchLoginRequest {
  string device_code = 1;
}

message WatchLoginResponse {
  LoginStatus status = 1;
  // Set once, only when APPROVED.
  string token = 2;
  string username = 3;
}

message DescribeLoginRequest {
  string user_code = 1;
}

message DescribeLoginResponse {
  bool found = 1;
  string label = 2;
  LoginStatus status = 3;
}

message DecideLoginRequest {
  string user_code = 1;
  bool approve = 2;
}

message DecideLoginResponse {
  LoginStatus status = 1;
}

message WhoAmIRequest {}

message WhoAmIResponse {
  // Empty when anonymous.
  string username = 1;
  bool admin = 2;
  // The caller's own recovery email (empty if none); the client derives its
  // Gravatar from it.
  string email = 3;
}

message CreateApiTokenRequest {
  string name = 1;
}

message CreateApiTokenResponse {
  string token = 1;
}

message LogoutRequest {}

message LogoutResponse {}

message Credential {
  // Opaque handle (the credential id), stable for removal.
  string id = 1;
  // User-chosen nickname, e.g. "MacBook Touch ID".
  string label = 2;
  google.protobuf.Timestamp added_at = 3;
}

message ListCredentialsRequest {}

message ListCredentialsResponse {
  repeated Credential credentials = 1;
}

message BeginAddCredentialRequest {}

message BeginAddCredentialResponse {
  string flow_id = 1;
  string options_json = 2;
}

message FinishAddCredentialRequest {
  string flow_id = 1;
  string credential_json = 2;
  string label = 3;
}

message FinishAddCredentialResponse {
  Credential credential = 1;
}

message RemoveCredentialRequest {
  string id = 1;
}

message RemoveCredentialResponse {}

enum SessionKind {
  SESSION_KIND_UNSPECIFIED = 0;
  SESSION_KIND_WEB = 1;
  SESSION_KIND_API = 2;
}

message Session {
  // Opaque handle (a prefix of the token's digest — never the token itself).
  string id = 1;
  SessionKind kind = 2;
  string label = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp expires_at = 5;
  // The session making this request.
  bool current = 6;
  // Last time the session was used (best-effort, updated at most ~hourly).
  google.protobuf.Timestamp last_seen = 7;
  // Client IP and a coarse device string parsed from the User-Agent
  // ("Chrome on macOS"), recorded on use.
  string ip = 8;
  string device = 9;
}

message WatchSessionsRequest {}

message WatchSessionsResponse {
  repeated Session sessions = 1;
}

message RevokeSessionRequest {
  string id = 1;
}

message RevokeSessionResponse {}

message RevokeOtherSessionsRequest {}

message RevokeOtherSessionsResponse {
  uint32 revoked = 1;
}

message SetEmailRequest {
  // The new recovery email, or empty to clear it.
  string email = 1;
}

message SetEmailResponse {}

message WatchOwnActivityRequest {
  // Size of the initial newest-first snapshot; 0 = the server default.
  uint32 limit = 1;
}

message WatchOwnActivityResponse {
  repeated AuditEntry entries = 1;
}

enum NotificationKind {
  NOTIFICATION_KIND_UNSPECIFIED = 0;
  NOTIFICATION_KIND_SUBMISSION_APPROVED = 1;
  NOTIFICATION_KIND_SUBMISSION_REJECTED = 2;
  // New firmware published for a device the caller follows.
  NOTIFICATION_KIND_NEW_FIRMWARE = 3;
  NOTIFICATION_KIND_NEW_SIGN_IN = 4;
}

message Notification {
  uint64 id = 1;
  google.protobuf.Timestamp at = 2;
  NotificationKind kind = 3;
  bool read = 4;
  // Server-composed, ready to render.
  string title = 5;
  string detail = 6;
  // In-app link target, e.g. "/saros/<device>/<version>" or "/account".
  string link = 7;
}

message WatchNotificationsRequest {
  // Size of the initial newest-first snapshot; 0 = the server default.
  uint32 limit = 1;
}

message WatchNotificationsResponse {
  // Newest-first; the full recent set, re-sent on every change.
  repeated Notification notifications = 1;
}

message MarkNotificationReadRequest {
  uint64 id = 1;
}

message MarkNotificationReadResponse {}

message MarkAllNotificationsReadRequest {}

message MarkAllNotificationsReadResponse {}
