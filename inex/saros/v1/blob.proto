edition = "2023";

package inex.saros.v1;

// Content-addressed blob storage, keyed by lowercase-hex SHA-256. Every method
// needs a session or the service token.
service BlobService {
  // Idempotent — same bytes, same sha256.
  rpc Upload(UploadRequest) returns (UploadResponse);
  rpc Stat(StatRequest) returns (StatResponse);
  // Authorize a download. With an egress mirror configured the response is a
  // fetch-here `url` (presigned S3, or public/CDN); otherwise the bytes come
  // back inline as `content`.
  rpc Download(DownloadRequest) returns (DownloadResponse);
}

message UploadRequest {
  bytes content = 1;
}

message UploadResponse {
  string sha256 = 1;
  uint64 size_bytes = 2;
}

message StatRequest {
  string sha256 = 1;
}

message StatResponse {
  bool exists = 1;
  uint64 size_bytes = 2;
}

message DownloadRequest {
  string sha256 = 1;
}

message DownloadResponse {
  // Inline bytes — set by the filesystem-only backend. Empty when `url` is set.
  bytes content = 1;
  // Fetch-here URL — set when an egress mirror serves the bytes.
  string url = 2;
}
