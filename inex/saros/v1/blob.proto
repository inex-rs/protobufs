edition = "2023";

package inex.saros.v1;

// Content-addressed blob storage, keyed by lowercase-hex SHA-256. Stat is
// unauthenticated; Upload and Download need a session or the service token.
service BlobService {
  // Idempotent — same bytes, same sha256.
  rpc Upload(UploadRequest) returns (UploadResponse);
  rpc Stat(StatRequest) returns (StatResponse);
  rpc Download(DownloadRequest) returns (DownloadResponse);
}

message UploadRequest {
  bytes content = 1;
}

message UploadResponse {
  string sha256 = 1;
  uint64 size_bytes = 2;
}

message StatRequest {
  string sha256 = 1;
}

message StatResponse {
  bool exists = 1;
  uint64 size_bytes = 2;
}

message DownloadRequest {
  string sha256 = 1;
}

message DownloadResponse {
  bytes content = 1;
}
